<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奇门通玄 · 经穴详情</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #f5efe3;
      color: #2a221a;
      font-family: "Noto Serif SC", "Songti SC", "PingFang SC", "Microsoft YaHei", serif;
    }

    .header {
      background: #fbf6e9;
      padding: 12px 16px;
      border-bottom: 1px solid #d9cfb9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header .back {
      color: #a8621f;
      text-decoration: none;
      font-size: 13px;
    }
    .header .back:hover { color: #b87333; }
    .header .title {
      color: #7a6b58;
      font-size: 11px;
      letter-spacing: 2px;
    }

    /* 主布局: 左侧图片 + 右侧信息 */
    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 420px) 1fr;
      gap: 0;
      min-height: calc(100vh - 50px);
    }

    /* 左侧: 穴位定位图 */
    .image-area {
      background: #f5efe3;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      border-right: 1px solid #d9cfb9;
    }
    .image-frame {
      background: #fffefb;
      border: 1px solid #d9cfb9;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(168, 98, 31, 0.05);
      max-width: 380px;
      width: 100%;
    }
    .image-frame img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 4px;
    }
    .image-caption {
      margin-top: 12px;
      text-align: center;
      color: #7a6b58;
      font-size: 12px;
      letter-spacing: 1px;
    }
    .no-image {
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fdfaf3;
      border: 1px dashed #d9cfb9;
      border-radius: 8px;
      color: #a89684;
      font-size: 13px;
    }

    /* 右侧: 信息栏 */
    .info-area {
      background: #fbf6e9;
      padding: 20px;
      overflow-y: auto;
      max-height: calc(100vh - 50px);
    }

    .info-card {
      background: #fdfaf3;
      border: 1px solid #d9cfb9;
      border-radius: 8px;
      padding: 18px 20px;
    }

    .info-card .title-block {
      border-bottom: 1px solid #e8dcc4;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .info-card .acupoint {
      color: #b8392e;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .info-card .code {
      color: #7a6b58;
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .info-card .meridian {
      color: #a8621f;
      font-size: 14px;
      font-weight: 600;
      padding: 4px 12px;
      background: #f5e8c5;
      border-radius: 12px;
      display: inline-block;
    }

    .info-card .section {
      margin-top: 14px;
    }
    .info-card .label {
      color: #a8621f;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .info-card .text {
      color: #2a221a;
      font-size: 14px;
      line-height: 1.7;
    }

    .info-card .functions li {
      list-style: none;
      color: #2a221a;
      font-size: 14px;
      padding: 3px 0 3px 14px;
      position: relative;
    }
    .info-card .functions li::before {
      content: '·';
      position: absolute;
      left: 4px;
      color: #a8621f;
      font-weight: 700;
    }

    /* 适用情形标签 */
    .ind-tag {
      display: inline-block;
      background: #faf5ea;
      border: 1px solid #e8dcc4;
      color: #5a4a3a;
      padding: 3px 10px;
      margin: 2px 4px 2px 0;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.5;
    }

    /* 警告框 */
    .warn-box {
      background: #f5dcd3;
      color: #a8331c;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 6px;
      margin-top: 14px;
      line-height: 1.6;
    }

    /* 类别标签 */
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .category-tag {
      display: inline-block;
      background: #e8dcc4;
      color: #7a5a2a;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
    }

    /* 古籍摘要 (引用风格) */
    .classical {
      background: #faf5ea;
      border-left: 3px solid #a8621f;
      padding: 8px 12px;
      font-style: italic;
      color: #5a4a3a;
      font-size: 13px;
      line-height: 1.7;
    }

    /* 来源信息 */
    .sources {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px dashed #d9cfb9;
      font-size: 11px;
      color: #888;
    }
    .source-tag {
      display: inline-block;
      background: #f0e9d8;
      color: #7a5a2a;
      padding: 2px 8px;
      margin-right: 4px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 500;
    }
    .source-link {
      color: #a8621f;
      text-decoration: none;
    }
    .source-link:hover { text-decoration: underline; }

    /* 加载 */
    .loading {
      position: fixed;
      inset: 0;
      background: #f5efe3;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .loading.hidden { display: none; }
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid #a8621f;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 错误状态 */
    .error-state {
      color: #a8331c;
      text-align: center;
      padding: 48px 16px;
      font-size: 14px;
      line-height: 1.7;
    }

    /* 移动端: 单列布局 */
    @media (max-width: 768px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .image-area {
        border-right: none;
        border-bottom: 1px solid #d9cfb9;
        padding: 16px;
      }
      .image-frame {
        max-width: 280px;
      }
      .info-area {
        padding: 16px;
        max-height: none;
      }
      .info-card {
        padding: 14px 16px;
      }
      .info-card .acupoint {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

<div class="loading" id="loading">
  <div class="loader"></div>
</div>

<div class="header">
  <a href="../" class="back">← 返回推算结果</a>
  <div class="title">奇门通玄 · 经穴详情</div>
</div>

<div class="layout">
  <div class="image-area" id="image-area">
    <!-- 穴位定位图将由 JS 注入 -->
  </div>
  <div class="info-area" id="info-area">
    <!-- 穴位信息将由 JS 注入 -->
  </div>
</div>

<script src="acupoint.js"></script>

</body>
</html>
