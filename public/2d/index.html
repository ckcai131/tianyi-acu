<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奇门通玄 · 经穴定位图</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #f5efe3;
      color: #2a221a;
      font-family: "Noto Serif SC", "Songti SC", "PingFang SC", "Microsoft YaHei", serif;
    }

    .header {
      background: #fbf6e9;
      padding: 12px 16px;
      border-bottom: 1px solid #d9cfb9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header .back {
      color: #a8621f;
      text-decoration: none;
      font-size: 13px;
    }
    .header .back:hover { color: #b87333; }
    .header .title {
      color: #7a6b58;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 0;
      min-height: calc(100vh - 50px);
    }

    .canvas-area {
      background: #f5efe3;
      padding: 16px;
      padding-top: 60px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: visible;
    }

    .view-toggle {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      background: #fbf6e9;
      border: 1px solid #d9cfb9;
      border-radius: 8px;
      padding: 4px;
      z-index: 10;
      box-shadow: 0 1px 4px rgba(168, 98, 31, 0.1);
    }
    .view-toggle button {
      background: transparent;
      border: none;
      color: #7a6b58;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }
    .view-toggle button.active {
      background: #a8621f;
      color: #fbf6ec;
    }

    .body-svg-container {
      background: #fffefb;
      border: 1px solid #d9cfb9;
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 2px 8px rgba(168, 98, 31, 0.05);
      position: relative;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: visible;
    }
    .body-svg-container svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 穴位标记 */
    .acupoint-marker {
      position: absolute;
      width: 14px;
      height: 14px;
      margin-left: -7px;
      margin-top: -7px;
      border-radius: 50%;
      background: rgba(168, 98, 31, 0.3);
      border: 1.5px solid #a8621f;
      cursor: pointer;
      transition: all 0.2s ease;
      pointer-events: auto;
    }
    .acupoint-marker:hover {
      background: rgba(168, 98, 31, 0.6);
      transform: scale(1.3);
    }
    .acupoint-marker.highlight {
      background: #b8392e;
      border-color: #b8392e;
      width: 22px;
      height: 22px;
      margin-left: -11px;
      margin-top: -11px;
      box-shadow: 0 0 0 4px rgba(184, 57, 46, 0.3), 0 0 12px rgba(184, 57, 46, 0.6);
      animation: pulse 1.6s ease-in-out infinite;
      z-index: 5;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(184, 57, 46, 0.3), 0 0 12px rgba(184, 57, 46, 0.6); }
      50% { box-shadow: 0 0 0 10px rgba(184, 57, 46, 0.1), 0 0 18px rgba(184, 57, 46, 0.8); }
    }

    /* 侧栏 */
    .sidebar {
      background: #fbf6e9;
      border-left: 1px solid #d9cfb9;
      padding: 16px;
      overflow-y: auto;
      max-height: calc(100vh - 50px);
    }

    .info-card {
      background: #fdfaf3;
      border: 1px solid #d9cfb9;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .info-card .acupoint {
      color: #b8392e;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .info-card .code {
      color: #7a6b58;
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .info-card .meridian {
      color: #a8621f;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      background: #f5e8c5;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 10px;
    }
    .info-card .label {
      color: #7a6b58;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 10px;
      margin-bottom: 4px;
    }
    .info-card .text {
      color: #2a221a;
      font-size: 13px;
      line-height: 1.6;
    }

    .info-card .functions li {
      list-style: none;
      color: #2a221a;
      font-size: 13px;
      padding: 3px 0;
      padding-left: 12px;
      position: relative;
    }
    .info-card .functions li::before {
      content: '·';
      position: absolute;
      left: 0;
      color: #a8621f;
      font-weight: 700;
    }

    .warn-box {
      background: #f5dcd3;
      color: #a8331c;
      font-size: 11px;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 10px;
    }

    /* 适用情形 标签 */
    .ind-tag {
      display: inline-block;
      background: #faf5ea;
      border: 1px solid #e8dcc4;
      color: #5a4a3a;
      padding: 2px 8px;
      margin: 2px 3px 2px 0;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.5;
    }

    /* 数据源标签 */
    .source-tag {
      display: inline-block;
      background: #f0e9d8;
      color: #7a5a2a;
      padding: 1px 6px;
      margin-right: 4px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 500;
    }

    .loading {
      position: fixed;
      inset: 0;
      background: #f5efe3;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .loading.hidden { display: none; }
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid #a8621f;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      color: #a89684;
      text-align: center;
      padding: 32px 12px;
      font-size: 13px;
      line-height: 1.7;
    }

    /* 移动端 */
    @media (max-width: 768px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .sidebar {
        border-left: none;
        border-top: 1px solid #d9cfb9;
        max-height: none;
      }
      .body-svg-container svg {
        max-width: 100%;
        width: 100%;
      }
      .info-card {
        padding: 10px;
      }
      .info-card .acupoint {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

<div class="loading" id="loading">
  <div class="loader"></div>
</div>

<div class="header">
  <a href="../" class="back">← 返回推算结果</a>
  <div class="title">奇门通玄 · 经穴定位图</div>
</div>

<div class="layout">
  <div class="canvas-area">
    <div class="view-toggle">
      <button class="active" data-view="front">前</button>
      <button data-view="back">后</button>
      <button data-view="left">左</button>
      <button data-view="right">右</button>
    </div>

    <div class="body-svg-container" id="body-container">
      <!-- SVG 将被注入 -->
    </div>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="empty-state">
      点击人体上的穴位标记，查看详细信息
    </div>
  </div>
</div>

<script src="acupoint.js"></script>

</body>
</html>
