<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奇门通玄 · 3D 经穴图</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #2a2520;
      color: #f0e6d0;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      z-index: 100;
    }
    #loading.hidden { display: none; }
    .loader {
      width: 60px;
      height: 60px;
      border: 3px solid #a8331c;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      background: rgba(26, 20, 16, 0.92);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(168, 98, 31, 0.4);
      z-index: 50;
      max-width: 480px;
    }
    #info .title {
      color: #b87333;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    #info .acupoint {
      color: #f6e8c9;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    #info .acupoint .code {
      color: #8a7d65;
      font-size: 13px;
      font-weight: 400;
      margin-left: 6px;
    }
    #info .meridian {
      color: #8a7d65;
      font-size: 12px;
    }
    #info .location {
      color: #d4c5a8;
      font-size: 11px;
      margin-top: 6px;
      line-height: 1.4;
    }
    #info .back {
      display: inline-block;
      color: #a8621f;
      font-size: 11px;
      text-decoration: none;
      margin-top: 8px;
    }
    #info .back:hover { color: #b87333; }

    #status {
      position: fixed;
      bottom: 12px;
      left: 12px;
      background: rgba(26, 20, 16, 0.85);
      color: #8a7d65;
      font-size: 10px;
      padding: 6px 10px;
      border-radius: 8px;
      z-index: 50;
      letter-spacing: 1px;
    }

    canvas { display: block; }
  </style>
</head>
<body>

<div id="loading">
  <div class="loader"></div>
</div>

<div id="info">
  <div class="title">3D 经穴图 · 奇门通玄</div>
  <div class="acupoint">
    <span id="acupoint-name">--</span>
    <span class="code" id="acupoint-code"></span>
  </div>
  <div class="meridian" id="acupoint-meridian">--</div>
  <div class="location" id="acupoint-location"></div>
  <a href="../" class="back">← 返回推算结果</a>
</div>

<div id="status">加载 3D 模型...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.160.0",
    "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="three.module.js?v=11"></script>

</body>
</html>
